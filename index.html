th.min(10,save.damage);save.rate=Math.min(10,save.rate);save.coins=Math.min(9999999,save.coins);save.unlocked=clampLevel(save.unlocked);if(Number.isFinite(d.materials))save.materials=Math.max(0,Math.min(999999,Math.floor(d.materials)));if(Array.isArray(d.weaponLevels))save.weaponLevels=[0,1,2].map(i=>Math.max(0,Math.min(5,Math.floor(Number(d.weaponLevels[i])||0))));if(Array.isArray(d.weapons))save.weapons=[true,!!d.weapons[1],!!d.weapons[2]];if(Number.isInteger(d.equipped)&&d.equipped>=0&&d.equipped<3&&save.weapons[d.equipped])save.equipped=d.equipped;if(d.achievements&&typeof d.achievements==='object'){const a=d.achievements;save.achievements={kills:Math.max(0,Math.floor(Number(a.kills)||0)),skills:Math.max(0,Math.floor(Number(a.skills)||0)),wins:Math.max(0,Math.floor(Number(a.wins)||0)),claimed:Array.isArray(a.claimed)?a.claimed.filter(x=>[0,1,2].includes(x)):[]}}if(d.daily&&typeof d.daily==='object')save.daily=d.daily;if(Array.isArray(d.records)){save.records=[0,1,2].map(i=>{const r=d.records[i];return r&&typeof r==='object'&&Number.isFinite(r.score)?{score:Math.max(0,Math.floor(r.score)),stars:Math.max(0,Math.min(3,Math.floor(r.stars)||0))}:null})}}catch(e){}function clampLevel(n){return Math.max(1,Math.min(3,Math.floor(n)||1))}function persist(){try{localStorage.setItem(saveKey,JSON.stringify(save))}catch(e){}}function cost(k){return 40+save[k]*35}const mechNames=['突击型','防御型','散射型'];const hangarShapes=[
