<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d20"><title>火力裂变：数字之门 V0.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#081329e8,#050819f0);color:white;text-align:center;padding:24px;z-index:3}#panel{width:min(360px,100%);border:1px solid #32dfff77;border-radius:24px;padding:28px 20px;background:#10203bc9;box-shadow:0 0 60px #0abaff20}h1{font-size:29px;margin:0 0 8px;color:#72f4ff;text-shadow:0 0 20px #11ddff66}p{color:#c5d9ec;line-height:1.65}button{background:linear-gradient(90deg,#13c9f4,#5678ff);color:white;border:0;border-radius:14px;font-weight:800;font-size:19px;padding:15px 30px;min-width:190px;box-shadow:0 6px 25px #1ca6ff55}small{display:block;color:#8fa8c6;margin-top:15px;line-height:1.7}</style></head><body><canvas id="game"></canvas><div id="overlay"><div id="panel"><h1 id="heading">火力裂变</h1><p id="message">数字之门 · V0.1<br>左右滑动移动机甲炮台<br>自动射击敌人，穿过增益门强化火力<br>生存到终点并击败最终首领！</p><button id="start">开始战斗</button><small>支持 iPhone / Android / 电脑浏览器<br>纯离线单文件 · 无需安装</small></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),start=document.getElementById('start');let W=0,H=0,dpr=1,scale=1,elapsed=0,last=0,mode='menu',player,bullets,enemies,gates,particles,spawnT,gateT,fireT,boss,score,kills,gateCount,progress,shake=0, pointer=false, targetX=0,stars=[];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';scale=Math.min(W/390,H/780);stars=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.5,1.8),speed:rand(12,50)}));if(player){player.x=clamp(player.x,30,W-30);targetX=clamp(targetX,30,W-30)}}addEventListener('resize',resize);resize();function reset(){player={x:W/2,y:H*.79,r:19,hp:100,maxHp:100,damage:10,shots:1,rate:4.2,inv:0};targetX=player.x;bullets=[];enemies=[];gates=[];particles=[];elapsed=0;spawnT=.7;gateT=2.3;fireT=0;boss=null;score=0;kills=0;gateCount=0;progress=0;shake=0;mode='play';overlay.style.display='none'}function end(win){if(mode!=='play')return;mode=win?'win':'lose';overlay.style.display='flex';heading.textContent=win?'任务完成！':'任务失败';message.innerHTML=win?`首领已被击败！<br>击杀 ${kills} · 得分 ${score}<br>通过增益门 ${gateCount} 次`:`机甲能量耗尽<br>击杀 ${kills} · 得分 ${score}<br>再试一次，优先选择蓝色增益门`;start.textContent='再来一局'}start.onclick=reset;function pos(e){let r=canvas.getBoundingClientRect();return clamp(e.clientX-r.left,26,W-26)}canvas.addEventListener('pointerdown',e=>{pointer=true;targetX=pos(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointer)targetX=pos(e)});canvas.addEventListener('pointerup',()=>pointer=false);canvas.addEventListener('pointercancel',()=>pointer=false);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')targetX-=55;if(e.key==='ArrowRight'||e.key==='d')targetX+=55;targetX=clamp(targetX,26,W-26);if(e.key===' '&&mode!=='play')reset()});function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(45,210);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.25,.7),max:.7,color,r:rand(2,5)})}}function enemy(x,y,type='drone'){const heavy=type==='heavy';return{x,y,type,r:heavy?23:15,hp:heavy?65:26,maxHp:heavy?65:26,speed:heavy?75:rand(90,135),dmg:heavy?26:13,phase:rand(0,7)}}function makeGate(){const options=[{kind:'shots',val:1,text:'+1 弹道',good:true},{kind:'damage',val:6,text:'+6 伤害',good:true},{kind:'rate',val:1.1,text:'+射速',good:true},{kind:'heal',val:25,text:'+25 护盾',good:true},{kind:'shots',val:-1,text:'-1 弹道',good:false},{kind:'damage',val:-5,text:'-5 伤害',good:false}];let a=options[Math.floor(rand(0,4))],b=options[Math.floor(rand(0,6))];if(Math.random()<.38)b=options[4+Math.floor(rand(0,2))];let gap=12,width=Math.min(142,(W-40-gap)/2),left=(W-(width*2+gap))/2;gates.push({x:left,y:-62,w:width,h:58,...a,used:false});gates.push({x:left+width+gap,y:-62,w:width,h:58,...b,used:false})}function applyGate(g){g.used=true;gateCount++;if(g.kind==='shots')player.shots=clamp(player.shots+g.val,1,7);if(g.kind==='damage')player.damage=clamp(player.damage+g.val,3,70);if(g.kind==='rate')player.rate=clamp(player.rate*g.val,2,12);if(g.kind==='heal')player.hp=Math.min(100,player.hp+g.val);score+=g.good?50:0;burst(player.x,player.y-20,g.good?'#28faff':'#ff547e',20)}function shoot(){let n=player.shots;for(let i=0;i<n;i++){let offset=i-(n-1)/2;bullets.push({x:player.x+offset*8,y:player.y-25,vx:offset*25,vy:-620,r:4.5,damage:player.damage})}burst(player.x,player.y-29,'#4cefff',3)}function hitPlayer(d){if(player.inv>0)return;player.hp-=d;player.inv=.55;shake=8;burst(player.x,player.y,'#ff647e',15);if(player.hp<=0)end(false)}function update(dt){if(mode!=='play')return;elapsed+=dt;progress=Math.min(1,elapsed/53);player.inv=Math.max(0,player.inv-dt);player.x+=(clamp(targetX,25,W-25)-player.x)*Math.min(1,dt*15);fireT-=dt;if(fireT<=0){shoot();fireT=1/player.rate}if(elapsed<47){spawnT-=dt;if(spawnT<=0){enemies.push(enemy(rand(25,W-25),-35,Math.random()<.17?'heavy':'drone'));spawnT=rand(.58,1.1)*(1-progress*.5)}gateT-=dt;if(gateT<=0){makeGate();gateT=rand(5.1,6.4)}}else if(!boss){boss={x:W/2,y:-75,r:47,hp:1150,maxHp:1150,phase:0,fire:1.4};enemies=[];gates=[]}if(boss){boss.y+=(H*.23-boss.y)*Math.min(1,dt*1.2);boss.phase+=dt;boss.x=clamp(W/2+Math.sin(boss.phase*1.3)*W*.23,55,W-55);boss.fire-=dt;if(boss.fire<=0){boss.fire=.95;for(let k=-1;k<=1;k++)enemies.push({x:boss.x+k*23,y:boss.y+25,type:'orb',r:10,hp:1,maxHp:1,speed:230,dmg:12,phase:0})}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y< -15||b.x<0||b.x>W){bullets.splice(i,1);continue}let consumed=false;if(boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+b.r){boss.hp-=b.damage;consumed=true;burst(b.x,b.y,'#ffb34b',2);if(boss.hp<=0){burst(boss.x,boss.y,'#ffb34b',65);score+=1500;end(true)}}if(!consumed){for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){e.hp-=b.damage;consumed=true;burst(b.x,b.y,'#65dfff',3);if(e.hp<=0){burst(e.x,e.y,'#fd6caa',10);enemies.splice(j,1);kills++;score+=e.type==='heavy'?30:10}break}}}if(consumed)bullets.splice(i,1)}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=e.speed*dt;e.phase+=dt;if(e.type==='drone')e.x+=Math.sin(e.phase*3)*15*dt;if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){hitPlayer(e.dmg);enemies.splice(i,1);continue}if(e.y>H+35){enemies.splice(i,1);if(e.type!=='orb')hitPlayer(7)}}for(let i=gates.length-1;i>=0;i--){let g=gates[i];g.y+=165*dt;if(!g.used&&Math.abs(player.y-(g.y+g.h/2))<player.r+g.h/2&&player.x+player.r>g.x&&player.x-player.r<g.x+g.w)applyGate(g);if(g.y>H+80)gates.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-dt*28)}function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function text(t,x,y,size=15,color='#fff',align='center'){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`800 ${size}px system-ui`;ctx.fillText(t,x,y)}function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#070d1e';ctx.fillRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101a3c');bg.addColorStop(1,'#081329');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const s of stars){let yy=(s.y+elapsed*s.speed)%H;ctx.fillStyle='#68b5ff66';ctx.fillRect(s.x,yy,s.r,s.r*2)}ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));let left=W*.07,right=W*.93;ctx.fillStyle='#111f38';ctx.beginPath();ctx.moveTo(left,0);ctx.lineTo(right,0);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.strokeStyle='#22d8ff30';ctx.lineWidth=2;for(let i=0;i<8;i++){let y=((i*H/7+elapsed*170)%H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#00dfff55';ctx.beginPath();ctx.moveTo(left,0);ctx.lineTo(0,H);ctx.moveTo(right,0);ctx.lineTo(W,H);ctx.stroke();for(const g of gates){if(g.used)continue;let c=g.good?'#16e9ff':'#ff4779';ctx.shadowColor=c;ctx.shadowBlur=20;roundRect(g.x,g.y,g.w,g.h,9,g.good?'#073c5bdd':'#54132ddd',c);ctx.shadowBlur=0;ctx.fillStyle=c;ctx.fillRect(g.x+5,g.y+5,4,g.h-10);ctx.fillRect(g.x+g.w-9,g.y+5,4,g.h-10);text(g.text,g.x+g.w/2,g.y+g.h/2+7,Math.min(19,g.w*.135))}for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.phase*.7);ctx.shadowBlur=14;ctx.shadowColor=e.type==='orb'?'#ffab4c':'#ff4b89';ctx.fillStyle=e.type==='orb'?'#ffb04a':'#dc3b79';ctx.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3;let x=Math.cos(a)*e.r,y=Math.sin(a)*e.r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#25152b';ctx.fillRect(-e.r*.45,-3,e.r*.9,6);ctx.restore();if(e.hp>1){roundRect(e.x-e.r,e.y-e.r-10,e.r*2,4,2,'#46263d');roundRect(e.x-e.r,e.y-e.r-10,e.r*2*e.hp/e.maxHp,4,2,'#ff6898')}}if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowColor='#ff873e';ctx.shadowBlur=35;ctx.fillStyle='#983e65';ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4+boss.phase*.25,r=boss.r*(i%2?.82:1.12);if(!i)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffcc62';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.restore();roundRect(W*.15,H*.12,W*.7,12,5,'#422339');roundRect(W*.15,H*.12,W*.7*Math.max(0,boss.hp/boss.maxHp),12,5,'#ff6d50');text('裂变核心 · BOSS',W/2,H*.12-10,15,'#ffca96')}for(const b of bullets){ctx.shadowBlur=11;ctx.shadowColor='#3ceeff';roundRect(b.x-3,b.y-10,6,18,3,'#90faff');ctx.shadowBlur=0}if(player){ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(elapsed*18)%2===0)ctx.globalAlpha=.5;ctx.shadowColor='#00dfff';ctx.shadowBlur=25;ctx.fillStyle='#0d4f7e';ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(22,15);ctx.lineTo(0,22);ctx.lineTo(-22,15);ctx.closePath();ctx.fill();ctx.strokeStyle='#63efff';ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0;roundRect(-7,-32,14,28,4,'#80f8ff');roundRect(-15,4,30,10,3,'#286eaa');ctx.fillStyle='#d6ffff';ctx.beginPath();ctx.arc(0,3,6,0,7);ctx.fill();ctx.restore()}for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();if(player&&mode!=='menu'){roundRect(16,20,Math.min(170,W*.43),16,7,'#25354c');roundRect(16,20,Math.min(170,W*.43)*Math.max(0,player.hp/100),16,7,player.hp>35?'#24e0b0':'#ff5c75');text('护盾 '+Math.max(0,Math.ceil(player.hp))+'%',20,49,12,'#d7faff','left');text('得分 '+score,W-16,32,15,'#fff','right');text('火力 '+player.shots+'路 × '+player.damage,W-16,54,12,'#83ecff','right');roundRect(16,H-23,W-32,5,3,'#29445b');roundRect(16,H-23,(W-32)*progress,5,3,'#30d9ff');text(boss?'最终首领':'关卡进度 '+Math.round(progress*100)+'%',W/2,H-33,12,'#bceaff');text('左右拖动 · 自动射击',W/2,H-62,12,'#c5dcff')}requestAnimationFrame(frame)}function frame(t){let dt=Math.min((t-last)/1000||0,.034);last=t;if(mode==='play')update(dt);draw()}requestAnimationFrame(frame)})();
</script></body></html>
