<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d20"><title>火力裂变：数字之门 V1.3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#081329e8,#050819f0);color:white;text-align:center;padding:24px;z-index:3}#panel{width:min(360px,100%);border:1px solid #32dfff77;border-radius:24px;padding:28px 20px;background:#10203bc9;box-shadow:0 0 60px #0abaff20}h1{font-size:29px;margin:0 0 8px;color:#72f4ff;text-shadow:0 0 20px #11ddff66}p{color:#c5d9ec;line-height:1.65}button{background:linear-gradient(90deg,#13c9f4,#5678ff);color:white;border:0;border-radius:14px;font-weight:800;font-size:19px;padding:15px 30px;min-width:190px;box-shadow:0 6px 25px #1ca6ff55}small{display:block;color:#8fa8c6;margin-top:15px;line-height:1.7}#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);left:12px;z-index:2;display:none;min-width:0;width:46px;height:46px;padding:0;border:1px solid #65eaffaa;border-radius:12px;background:#102c4cdd;color:#d9faff;font-size:22px;box-shadow:0 4px 20px #00dfff22}#pauseBtn:active{transform:scale(.95)}#shop{display:grid;gap:7px;margin-top:12px}#shop button{min-width:0;font-size:14px;padding:10px;background:#174260;box-shadow:none;border:1px solid #44dfff66}#shop button:disabled{opacity:.4}#wallet{color:#ffda76;font-weight:800}#shopHint{font-size:12px;color:#a6d5ec}#panel{max-height:calc(100dvh - 36px);overflow-y:auto}#levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}#levels button{min-width:0;font-size:12px;padding:10px 2px;background:#142d ;min-width:0;width:76px;height:76px;border-radius:50%;padding:4px;font-size:13px;border:2px solid #8cf8ff;background:#14577bdf;box-shadow:0 0 20px #11ddff66}#skillBtn:disabled{opacity:.55}#skillBtn:active{transform:scale(.96)}#soundBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:4;display:block;min-width:0;width:46px;height:46px;padding:0;font-size:21px;border:1px solid #65eaffaa;border-radius:12px;background:#102c4cdd;box-shadow:none}#soundBtn:active{transform:scale(.95)}#records{font-size:12px;color:#a8cbe2;margin:7px 0;line-height:1.5}#resultStars{font-size:29px;color:#ffda69;letter-spacing:5px;text-shadow:0 0 15px #ffbf3977;min-height:0}#resultStars:empty{display:none}</style></head><body><canvas id="game"></canvas><button id="pauseBtn" type="button" aria-label="暂停游戏">Ⅱ</button><button id="soundBtn" type="button" aria-label="切换音效">🔇</button><button id="skillBtn" type="button" aria-label="释放机甲技能">技能</button><div id="overlay"><div id="panel"><h1 id="heading">火力裂变</h1><div id="hangar" aria-hidden="true"><svg viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg"><path d="M55 5 77 20 91 50 77 83 55 100 33 83 19 50 33 20Z" fill="#123b63" stroke="#42e9ff" stroke-width="3"/><path d="M55 15 66 37 80 45 71 73 55 88 39 73 30 45 44 37Z" fill="#1c7bb3" stroke="#a2faff" stroke-width="2"/><path d="M49 4h12l5 45-11 12-11-12Z" fill="#9afaff"/><path d="M27 48 9 62l9 22 24-10M83 48l18 14-9 22-24-10" fill="#1d5a91" stroke="#51dcff" stroke-width="3"/><circle cx="55" cy="64" r="9" fill="#e3ffff" stroke="#16d6ff" stroke-width="4"/></svg></div><div id="stats"><span>伤害 <b id="statDamage">10</b></span><span>射速 <b id="statRate">4.2</b>/秒</span></div><p id="message">数字之门 · V1.3<br>左右滑动移动机甲炮台<br>自动射击敌人，穿过增益门强化火力<br>生存到终点并击败最终首领！</p><div id="mechs"><button type="button" data-mech="0">⚡ 突击型</button><button type="button" data-mech="1">🛡 防御型</button><button type="button" data-mech="2">✦ 散射型</button></div><div id="records">最佳记录：尚未通关</div><div id="resultStars"></div><div id="levels"><button type="button" data-level="1">第一关</button><button type="button" data-level="2">第二关</button><button type="button" data-level="3">第三关</button></div><button id="start">开始战斗</button><div id="shop"><div id="wallet">金币 0</div><button id="upgradeDamage" type="button">升级伤害</button><button id="upgradeRate" type="button">升级射速</button><div id="shopHint">永久升级仅在战斗外购买</div></div><small>支持 iPhone / Android / 电脑浏览器<br>纯离线单文件 · 无需安装</small></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),start=document.getElementById('start'),pauseBtn=document.getElementById('pauseBtn'),skillBtn=document.getElementById('skillBtn'),soundBtn=document.getElementById('soundBtn'),wallet=document.getElementById('wallet'),upgradeDamage=document.getElementById('upgradeDamage'),upgradeRate=document.getElementById('upgradeRate'),shopHint=document.getElementById('shopHint');let W=0,H=0,dpr=1,scale=1,elapsed=0,last=0,mode='menu',player=null,bullets=[],enemies=[],gates=[],particles=[],spawnT=0,gateT=0,fireT=0,boss=null,score=0,kills=0,gateCount=0,progress=0,shake=0, pointer=false, targetX=0,stars=[];const saveKey='firepower-gates-save-v05';let save={coins:0,damage:0,rate:0,unlocked:1,records:[null,null,null]},selectedLevel=1,selectedMech=0,skillCooldown=0,skillFlash=0,overclockTime=0;try{let d=JSON.parse(localStorage.getItem(saveKey)||'{}');for(const k of ['coins','damage','rate','unlocked'])if(Number.isFinite(d[k]))save[k]=Math.max(0,Math.floor(d[k]));save.damage=Math.min(10,save.damage);save.rate=Math.min(10,save.rate);save.coins=Math.min(9999999,save.coins);save.unlocked=clampLevel(save.unlocked);if(Array.isArray(d.records)){save.records=[0,1,2].map(i=>{const r=d.records[i];return r&&typeof r==='object'&&Number.isFinite(r.score)?{score:Math.max(0,Math.floor(r.score)),stars:Math.max(0,Math.min(3,Math.floor(r.stars)||0))}:null})}}catch(e){}function clampLevel(n){return Math.max(1,Math.min(3,Math.floor(n)||1))}function persist(){try{localStorage.setItem(saveKey,JSON.stringify(save))}catch(e){}}function cost(k){return 40+save[k]*35}const mechNames=['突击型','防御型','散射型'];function renderShop(){const record=save.records[selectedLevel-1];document.getElementById('records').textContent=record?'第'+selectedLevel+'关最佳：'+record.score+'分 · '+ '★'.repeat(record.stars)+'☆'.repeat(3-record.stars):'第'+selectedLevel+'关：尚无通关记录';document.getElementById('records').style.display=(mode==='play'||mode==='pause')?'none':'block';document.getElementById('resultStars').style.display=(mode==='play'||mode==='pause')?'none':'block';document.getElementById('mechs').style.display=(mode==='play'||mode==='pause')?'none':'grid';document.querySelectorAll('#mechs button').forEach(b=>b.classList.toggle('selected',Number(b.dataset.mech)===selectedMech));document.getElementById('shop').style.display=(mode==='play'||mode==='pause')?'none':'grid';document.getElementById('levels').style.display=(mode==='play'||mode==='pause')?'none':'grid';document.getElementById('hangar').style.display=(mode==='play'||mode==='pause')?'none':'flex';document.getElementById('stats').style.display=(mode==='play'||mode==='pause')?'none':'flex';document.querySelectorAll('#levels button').forEach(b=>{let n=Number(b.dataset.level);b.disabled=n>save.unlocked;b.classList.toggle('selected',n===selectedLevel);b.textContent=n>save.unlocked?'🔒 第'+n+'关':'第'+n+'关'});wallet.textContent='◆ 金币 '+save.coins;document.getElementById('statDamage').textContent=10+save.damage*2;document.getElementById('statRate').textContent=(4.2+save.rate*.25).toFixed(2);for(const [k,b] of [['damage',upgradeDamage],['rate',upgradeRate]]){b.textContent=(k==='damage'?'伤害':'射速')+' Lv.'+save[k]+'/10 · '+(save[k]>=10?'满级':cost(k)+'金币');b.disabled=save[k]>=10||save.coins<cost(k)}}function buy(k){if(mode==='play'||mode==='pause'||save[k]>=10||save.coins<cost(k))return;save.coins-=cost(k);save[k]++;persist();renderShop();shopHint.textContent='购买成功，下局生效'}upgradeDamage.onclick=()=>buy('damage');upgradeRate.onclick=()=>buy('rate');document.querySelectorAll('#mechs button').forEach(b=>b.addEventListener('click',()=>{if(mode==='play'||mode==='pause')return;selectedMech=Number(b.dataset.mech);renderShop();shopHint.textContent='已选择'+mechNames[selectedMech]}));document.querySelectorAll('#levels button').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.level);if(n<=save.unlocked&&mode!=='play'&&mode!=='pause'){selectedLevel=n;renderShop();shopHint.textContent='已选择第'+n+'关'}}));renderShop();const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';scale=Math.min(W/390,H/780);stars=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.5,1.8),speed:rand(12,50)}));if(player){player.x=clamp(player.x,30,W-30);targetX=clamp(targetX,30,W-30)}}addEventListener('resize',resize);resize();let audioCtx=null,soundOn=false,lastShotSound=0,lastHitSound=0;try{soundOn=localStorage.getItem('firepower-gates-sound')==='on'}catch(e){}soundBtn.textContent=soundOn?'🔊':'🔇';soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';try{localStorage.setItem('firepower-gates-sound',soundOn?'on':'off')}catch(e){}if(soundOn)playSound('select')};function playSound(kind){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});if(audioCtx.state!=='running')return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();let freq=440,dur=.09,vol=.025,type='sine';if(kind==='shot'){freq=680;dur=.035;vol=.007;type='triangle'}else if(kind==='hit'){freq=190;dur=.13;vol=.04;type='sawtooth'}else if(kind==='kill'){freq=520;dur=.12;vol=.028;type='triangle'}else if(kind==='skill'){freq=310;dur=.32;vol=.055;type='sine'}else if(kind==='boss'){freq=130;dur=.45;vol=.06;type='sawtooth'}o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}function reset(){document.getElementById('resultStars').textContent='';skillCooldown=0;skillFlash=0;overclockTime=0;skillBtn.style.display='block';skillBtn.disabled=false;skillBtn.textContent='释放技能';if(selectedLevel>save.unlocked)selectedLevel=save.unlocked;player={x:W/2,y:H*.79,r:19,hp:selectedMech===1?140:100,maxHp:selectedMech===1?140:100,damage:10+save.damage*2,shots:selectedMech===2?2:1,rate:4.2+save.rate*.25+(selectedMech===0?.7:0),inv:0,hitNote:'',hitNoteTime:0,gateNote:'',gateNoteTime:0};targetX=player.x;bullets=[];enemies=[];gates=[];particles=[];elapsed=0;spawnT=.7;gateT=2.3;fireT=0;boss=null;score=0;kills=0;gateCount=0;progress=0;shake=0;mode='play';overlay.style.display='none';pauseBtn.style.display='block';start.textContent='开始战斗';renderShop()}function end(win){if(mode!=='play')return;skillBtn.style.display='none';const stars=win?(player.hp/player.maxHp>=.7?3:player.hp/player.maxHp>=.3?2:1):0;const previous=save.records[selectedLevel-1];const newBest=win&&(!previous||score>previous.score);if(win){save.records[selectedLevel-1]={score:Math.max(score,previous?previous.score:0),stars:Math.max(stars,previous?previous.stars:0)}}const starBonus=win?stars*25*selectedLevel:0;const earned=Math.max(5,Math.floor(score/15)+kills*2+(win?100*selectedLevel:0)+starBonus);if(win&&selectedLevel<3){save.unlocked=Math.max(save.unlocked,selectedLevel+1)}save.coins=Math.min(9999999,save.coins+earned);persist();mode=win?'win':'lose';overclockTime=0;renderShop();shopHint.textContent='本局获得 '+earned+' 金币'+(win&&selectedLevel<3?' · 已解锁下一关':'');pauseBtn.style.display='none';overlay.style.display='flex';heading.textContent=win?'第'+selectedLevel+'关完成！':'第'+selectedLevel+'关失败';document.getElementById('resultStars').textContent=win?'★'.repeat(stars)+'☆'.repeat(3-stars):'';message.innerHTML=win?`首领已被击败！${newBest?'<br>🏆 新最高分！':''}<br>击杀 ${kills} · 得分 ${score}<br>通过增益门 ${gateCount} 次<br>三星奖励 ${starBonus} 金币<br>本局获得 ${earned} 金币`:`机甲能量耗尽<br>击杀 ${kills} ·
